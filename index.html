<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Attention Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <main class="page-shell">
    <div class="paper-grain"></div>
    <div class="scene-accent accent-red" aria-hidden="true"></div>
    <div class="scene-accent accent-blue" aria-hidden="true"></div>
    <div class="scene-accent accent-yellow" aria-hidden="true"></div>
    <section class="hero app-shell" data-tab-root>
      <header class="hero-top">
        <div>
          <p class="eyebrow">Live face analysis</p>
          <h1>Attention Monitor</h1>
        </div>
        <div class="hero-actions">
          <div class="stamp">Are you attentive?</div>
          <div class="tab-strip" role="tablist" aria-label="View modes">
            <button class="tab-button is-active" type="button" data-tab-button="monitor" aria-pressed="true">Monitor</button>
            <button class="tab-button" type="button" data-tab-button="theater" aria-pressed="false">Theater</button>
          </div>
        </div>
      </header>

      <section class="tab-panel is-active" data-tab-panel="monitor">
        <div class="monitor-grid">
          <div class="status-grid">
            <div class="status-card status-face">
              <span>Face</span>
              <strong id="face-status">Loading</strong>
            </div>
            <div class="status-card status-gaze">
              <span>Gaze</span>
              <strong id="gaze-status">Loading</strong>
            </div>
            <div class="status-card status-eyes">
              <span>Eyes</span>
              <strong id="eye-status">Loading</strong>
            </div>
            <div class="status-card status-state">
              <span>State</span>
              <strong id="attention-status">Loading</strong>
            </div>
          </div>

          <section class="camera-stage">
            <div class="tamago-frame">
              <div class="camera-shell">
                <video id="camera-video" autoplay playsinline muted></video>
                <canvas id="camera-canvas" aria-label="Live browser camera preview"></canvas>
                <div class="camera-message" id="camera-message">Preparing camera</div>
                <div class="camera-hud" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </div>
          </section>
        </div>

        <footer class="hero-footer">
          <span>Browser camera</span>
          <span>MediaPipe Tasks Vision</span>
          <span>No backend stream</span>
        </footer>
      </section>

      <section class="tab-panel theater-panel" data-tab-panel="theater" aria-label="Fullscreen video theater">
        <div class="theater-stage">
          <img id="theater-image" class="theater-media" src="public/01-1000132806.png" alt="" />
          <audio id="theater-audio" src="public/playlistmusic.mp3" preload="auto" loop></audio>
          <div class="mirror-shell" aria-label="Attention mirror">
            <span class="mirror-label">Mirror cam</span>
            <canvas id="mirror-canvas" class="mirror-video" aria-label="Camera mirror preview"></canvas>
          </div>
          <button id="theater-back" class="theater-back" type="button">Back</button>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="static/app.js"></script>
</body>
</html>
